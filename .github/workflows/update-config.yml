name: Update Config (Pricing & CO2 Factors)

on:
  schedule:
    # Exécuter tous les jours à 00:00 UTC (minuit)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permettre de déclencher manuellement
    inputs:
      force_update:
        description: 'Forcer la mise à jour même si le cache est valide'
        required: false
        default: 'false'

jobs:
  update-config:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour avoir l'historique complet
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install requests pyyaml
    
    - name: Run config updater
      id: update
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from utils.config_updater import update_config
        import json
        
        try:
            results = update_config()
            print('UPDATE_RESULTS=' + json.dumps(results))
            
            # Compter les succès et échecs
            total_success = (
                len(results.get('models_pricing', {}).get('success', [])) +
                len(results.get('saas_pricing', {}).get('success', [])) +
                len(results.get('co2_factors', {}).get('success', []))
            )
            total_failed = (
                len(results.get('models_pricing', {}).get('failed', [])) +
                len(results.get('saas_pricing', {}).get('failed', [])) +
                len(results.get('co2_factors', {}).get('failed', []))
            )
            
            print(f'Total success: {total_success}')
            print(f'Total failed: {total_failed}')
            
            # Déterminer si on doit commiter
            if total_success > 0:
                print('CHANGES_DETECTED=true') >> $GITHUB_ENV
            else:
                print('CHANGES_DETECTED=false') >> $GITHUB_ENV
                
        except Exception as e:
            print(f'Error: {e}')
            print('CHANGES_DETECTED=false') >> $GITHUB_ENV
            sys.exit(1)
        " >> $GITHUB_OUTPUT
      env:
        UPDATE_RESULTS: ${{ steps.update.outputs.results }}
    
    - name: Check for changes
      id: check_changes
      run: |
        # Vérifier si des fichiers ont été modifiés
        git status
        if [ -n "$(git status --porcelain)" ]; then
          echo "CHANGES=true" >> $GITHUB_OUTPUT
        else
          echo "CHANGES=false" >> $GITHUB_OUTPUT
        fi
      id: changes
    
    - name: Commit and push changes
      if: steps.changes.outputs.CHANGES == 'true'
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        # Ajouter tous les fichiers modifiés
        git add config/models.yaml .cache/config_cache.json .cache/last_update.txt
        
        # Créer un message de commit
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S")
        git commit -m "🤖 Auto-update: Pricing and CO2 factors (${TIMESTAMP})"
        
        # Pousser les changements
        git push origin main
        
        echo "Configuration mise à jour et poussée vers le dépôt."
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const results = JSON.parse(process.env.UPDATE_RESULTS || '{}');
          const message = `
            ❌ **Mise à jour automatique échouée**
            
            **Modèles:** ${results.models_pricing?.success?.length || 0} succès, ${results.models_pricing?.failed?.length || 0} échecs
            **SaaS:** ${results.saas_pricing?.success?.length || 0} succès, ${results.saas_pricing?.failed?.length || 0} échecs
            **CO2:** ${results.co2_factors?.success?.length || 0} succès, ${results.co2_factors?.failed?.length || 0} échecs
            
            **Action:** Vérifiez les logs pour plus de détails.
          `;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: 1,  # Numéro de l'issue pour les notifications
            body: message
          });
      env:
        UPDATE_RESULTS: ${{ steps.update.outputs.UPDATE_RESULTS }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify on success
      if: success() && steps.changes.outputs.CHANGES == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const results = JSON.parse(process.env.UPDATE_RESULTS || '{}');
          const message = `
            ✅ **Mise à jour automatique réussie**
            
            **Modèles:** ${results.models_pricing?.success?.length || 0} mis à jour, ${results.models_pricing?.failed?.length || 0} échecs
            **SaaS:** ${results.saas_pricing?.success?.length || 0} mis à jour, ${results.saas_pricing?.failed?.length || 0} échecs
            **CO2:** ${results.co2_factors?.success?.length || 0} mis à jour, ${results.co2_factors?.failed?.length || 0} échecs
            
            **Commit:** ${context.sha}
            **Timestamp:** ${new Date().toISOString()}
          `;
          
          // Créer un commentaire sur l'issue #1 ou envoyer une notification
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: message
            });
          } catch (e) {
            console.log('Impossible de créer un commentaire:', e.message);
          }
      env:
        UPDATE_RESULTS: ${{ steps.update.outputs.UPDATE_RESULTS }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-updates:
    needs: update-config
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify config was updated
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from utils.config_updater import get_update_status
        import json
        
        status = get_update_status()
        print('Last update:', status.get('last_update'))
        print('Models count:', status.get('models_count'))
        print('SaaS count:', status.get('saas_count'))
        
        # Vérifier que la configuration est valide
        import yaml
        with open('config/models.yaml', 'r') as f:
            config = yaml.safe_load(f)
        
        assert 'models' in config, 'Modèles manquants'
        assert 'saas_subscriptions' in config, 'SaaS manquants'
        print('✅ Configuration valide')
        "
