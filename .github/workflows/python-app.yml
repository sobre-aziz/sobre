name: Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort
    
    - name: Check code style with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check import order with isort
      run: |
        isort . --check-only --diff
    
    - name: Check code formatting with black
      run: |
        black . --check --diff || echo "Black formatting check (non-blocking)"

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify imports
      run: |
        python -c "from app import *; from utils.cost_calculator import *; from utils.carbon_calculator import *; from utils.subscription_tracker import *; from utils.greenops_scoring import *; from utils.report_generator import *; print('All imports successful')"
    
    - name: Create reports directory
      run: |
        mkdir -p reports
        echo "Reports directory created"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Streamlit
      run: |
        pip install streamlit
    
    - name: Test Streamlit app
      run: |
        # Test that the app can be parsed without errors
        python -c "import streamlit as st; import ast; ast.parse(open('app.py').read()); print('App syntax OK')"
    
    - name: Upload app as artifact
      uses: actions/upload-artifact@v4
      with:
        name: streamlit-app
        path: |
          app.py
          utils/
          config/
          requirements.txt
          reports/
        retention-days: 1
