# Facteur de conversion CO2 -> km en voiture (moyenne : 200g CO2/km)
co2_to_car_km_factor: 0.2

# Seuils pour les badges de maturité (en € et g CO2)
badges:
  gold:
    name: "🥇 Or - Expert"
    max_cost: 50
    max_co2: 250
    score: 100
    
  silver:
    name: "🥈 Argent - Avancé"
    max_cost: 200
    max_co2: 1000
    score: 80
    
  bronze:
    name: "🥉 Bronze - Intermédiaire"
    max_cost: 500
    max_co2: 2500
    score: 60
    
  sufficient:
    name: "✅ Suffisant"
    max_cost: 1000
    max_co2: 5000
    score: 40
    
  insufficient:
    name: "⚠️ Insuffisant"
    max_cost: 5000
    max_co2: 25000
    score: 20

# Seuils pour le score GreenOps (A à E)
greenops_scores:
  A:
    name: "A - Excellent"
    max_cost_per_employee: 10
    max_co2_per_employee: 50
    min_dormant_licenses: 95  # % de licences actives
    
  B:
    name: "B - Bon"
    max_cost_per_employee: 25
    max_co2_per_employee: 125
    min_dormant_licenses: 90
    
  C:
    name: "C - Moyen"
    max_cost_per_employee: 50
    max_co2_per_employee: 250
    min_dormant_licenses: 80
    
  D:
    name: "D - À améliorer"
    max_cost_per_employee: 100
    max_co2_per_employee: 500
    min_dormant_licenses: 60
    
  E:
    name: "E - Critique"
    max_cost_per_employee: 1000
    max_co2_per_employee: 5000
    min_dormant_licenses: 0
