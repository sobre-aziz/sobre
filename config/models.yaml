# Configuration des modèles IA pour Sobre
# Sources officielles :
# - Coûts : Tarifs publics des fournisseurs (OpenAI, Mistral AI, Meta)
#   - OpenAI Pricing: https://openai.com/pricing
#   - Mistral AI Pricing: https://mistral.ai/pricing/
#   - Meta Llama Pricing: https://aws.amazon.com/bedrock/llama/
# - CO2 : Données scientifiques basées sur :
#   - "Carbon Footprint of AI Models" (arXiv:2111.02186)
#   - Microsoft Sustainability Report 2023
#   - ADEME - Impact environnemental du numérique
#
# Note: Les valeurs CO2 sont des estimations moyennes par 1M tokens
# Conversion: 1 kg CO2 = 1000 g CO2

models:
  # Modèles OpenAI
  GPT-4:
    name: "GPT-4"
    description: "Modèle propriétaire de OpenAI, très performant"
    cost_per_token_input: 0.00003    # 0.03€ par 1k tokens (input)
    cost_per_token_output: 0.00006   # 0.06€ par 1k tokens (output)
    co2_per_million_tokens: 0.3       # 0.3 kg CO2 par 1M tokens (300 g)
    provider: "OpenAI"
    category: "proprietary"
    saas_type: "api"
    
  GPT-3.5-turbo:
    name: "GPT-3.5-turbo"
    description: "Version optimisée de GPT-3.5"
    cost_per_token_input: 0.0000015  # 0.0015€ par 1k tokens (input)
    cost_per_token_output: 0.000002  # 0.002€ par 1k tokens (output)
    co2_per_million_tokens: 0.2       # 0.2 kg CO2 par 1M tokens (200 g)
    provider: "OpenAI"
    category: "proprietary"
    saas_type: "api"

  # Modèles Mistral AI
  Mistral-7B:
    name: "Mistral-7B"
    description: "Modèle open-source de Mistral AI, léger et performant"
    cost_per_token_input: 0.000002   # 0.002€ par 1k tokens
    cost_per_token_output: 0.000002  # 0.002€ par 1k tokens
    co2_per_million_tokens: 0.05      # 0.05 kg CO2 par 1M tokens (50 g)
    provider: "Mistral AI"
    category: "open-source"
    saas_type: "api"
    
  Mistral-8x7B:
    name: "Mistral-8x7B"
    description: "Modèle Mixture of Experts de Mistral AI"
    cost_per_token_input: 0.0000005  # 0.0005€ par 1k tokens
    cost_per_token_output: 0.0000005 # 0.0005€ par 1k tokens
    co2_per_million_tokens: 0.03      # 0.03 kg CO2 par 1M tokens (30 g)
    provider: "Mistral AI"
    category: "open-source"
    saas_type: "api"

  # Modèles Meta
  Llama-2-70B:
    name: "Llama-2-70B"
    description: "Modèle open-source de Meta"
    cost_per_token_input: 0.000001   # 0.001€ par 1k tokens
    cost_per_token_output: 0.000001  # 0.001€ par 1k tokens
    co2_per_million_tokens: 0.03      # 0.03 kg CO2 par 1M tokens (30 g)
    provider: "Meta"
    category: "open-source"
    saas_type: "api"
    
  Llama-3:
    name: "Llama-3"
    description: "Modèle open-source de Meta, nouvelle génération"
    cost_per_token_input: 0.0000015  # 0.0015€ par 1k tokens
    cost_per_token_output: 0.0000015 # 0.0015€ par 1k tokens
    co2_per_million_tokens: 0.04      # 0.04 kg CO2 par 1M tokens (40 g)
    provider: "Meta"
    category: "open-source"
    saas_type: "api"

# SaaS avec IA (abonnements mensuels)
saas_subscriptions:
  ChatGPT-Plus:
    name: "ChatGPT Plus"
    description: "Abonnement premium à ChatGPT"
    monthly_cost: 20.00              # 20€/mois
    estimated_tokens_per_month: 1000000  # Estimation: 1M tokens/mois
    co2_per_month: 0.3                # 0.3 kg CO2/mois (basé sur GPT-4)
    provider: "OpenAI"
    category: "saas"
    saas_type: "subscription"
    
  ChatGPT-Enterprise:
    name: "ChatGPT Enterprise"
    description: "Abonnement entreprise pour ChatGPT"
    monthly_cost: 40.00              # 40€/utilisateur/mois (estimation)
    estimated_tokens_per_month: 5000000  # 5M tokens/mois
    co2_per_month: 1.5                # 1.5 kg CO2/mois
    provider: "OpenAI"
    category: "saas"
    saas_type: "subscription"
    
  Copilot:
    name: "GitHub Copilot"
    description: "Assistant IA pour le développement"
    monthly_cost: 10.00              # 10€/mois
    estimated_tokens_per_month: 500000   # 500K tokens/mois
    co2_per_month: 0.15               # 0.15 kg CO2/mois
    provider: "GitHub/Microsoft"
    category: "saas"
    saas_type: "subscription"
    
  Copilot-Business:
    name: "GitHub Copilot Business"
    description: "Version entreprise de Copilot"
    monthly_cost: 19.00              # 19€/utilisateur/mois
    estimated_tokens_per_month: 1000000  # 1M tokens/mois
    co2_per_month: 0.3                # 0.3 kg CO2/mois
    provider: "GitHub/Microsoft"
    category: "saas"
    saas_type: "subscription"
    
  Notion-AI:
    name: "Notion AI"
    description: "Assistant IA intégré à Notion"
    monthly_cost: 10.00              # 10€/mois (en plus de l'abonnement Notion)
    estimated_tokens_per_month: 250000   # 250K tokens/mois
    co2_per_month: 0.075              # 0.075 kg CO2/mois
    provider: "Notion"
    category: "saas"
    saas_type: "subscription"
    
  Midjourney:
    name: "Midjourney"
    description: "Génération d'images par IA"
    monthly_cost: 30.00              # 30€/mois (plan de base)
    estimated_images_per_month: 100       # 100 images/mois
    co2_per_month: 0.5                 # 0.5 kg CO2/mois (estimation)
    provider: "Midjourney"
    category: "saas"
    saas_type: "subscription"
    
  Canva-Magic:
    name: "Canva Magic"
    description: "Outils IA de Canva"
    monthly_cost: 12.99              # 12.99€/mois
    estimated_tokens_per_month: 200000   # 200K tokens/mois
    co2_per_month: 0.06               # 0.06 kg CO2/mois
    provider: "Canva"
    category: "saas"
    saas_type: "subscription"

# Mots-clés pour la détection des abonnements IA
