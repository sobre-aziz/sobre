# ============================================
# 7. SEUILS GREENOPS
# ============================================
# Recalculés pour permettre à une PME avec 1 abonnement IA d'atteindre le score A
# Source: Proposition Nouvelle Méthode - Sobre
seuils_greenops:
  A:
    name: "A - Excellent"
    max_coût_par_employé: 50
    max_co2_par_employé_g: 250
    min_licences_actives: 95
    
  B:
    name: "B - Bon"
    max_coût_par_employé: 100
    max_co2_par_employé_g: 500
    min_licences_actives: 90
    
  C:
    name: "C - Moyen"
    max_coût_par_employé: 200
    max_co2_par_employé_g: 1000
    min_licences_actives: 80
    
  D:
    name: "D - À améliorer"
    max_coût_par_employé: 500
    max_co2_par_employé_g: 2500
    min_licences_actives: 60
    
  E:
    name: "E - Critique"
    max_coût_par_employé: 1000000
    max_co2_par_employé_g: 1000000
    min_licences_actives: 0

