# ============================================
# 6. HYPOTHÈSES D'USAGE (SaaS)
# ============================================
# Utilisées pour estimer les tokens mensuels des SaaS
# Configurables par l'utilisateur
hypotheses_usage:
  # Niveaux d'usage pour les SaaS
  niveaux:
    faible:
      description: "Utilisation occasionnelle (ex: quelques requêtes par jour)"
      tokens_mensuels: 250000
      
    moyen:
      description: "Utilisation régulière (ex: utilisation quotidienne)"
      tokens_mensuels: 1000000
      
    fort:
      description: "Utilisation intensive (ex: plusieurs heures par jour)"
      tokens_mensuels: 5000000

  # Mapping SaaS → Modèle sous-jacent (pour estimation CO₂)
  saas_to_model:
    ChatGPT_Plus: "GPT-4"
    ChatGPT_Enterprise: "GPT-4"
    Copilot: "GPT-3.5-turbo"
    Copilot_Business: "GPT-4"
    Notion_AI: "Mistral-7B"
    Midjourney: "Stable Diffusion"
    Canva_Magic: "Mistral-7B"
    Jasper_AI: "GPT-4"
